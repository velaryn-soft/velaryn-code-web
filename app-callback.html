<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velaryn Code</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0e17; color: #d6dcea;
         font: 16px -apple-system, BlinkMacSystemFont, Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  a { display: inline-block; margin-top: 14px; padding: 12px 20px; border-radius: 10px; color: #fff; text-decoration: none;
      background: linear-gradient(135deg, #3fc3ff, #2f6bff 60%, #2a3dff); }
  p { color: #8a93a8; }
</style>
</head>
<body>
<div>
  <img src="logo.png" width="72" height="72" alt="">
  <h2>Returning to Velaryn Code…</h2>
  <p>If the app doesn't open, tap the button.</p>
  <a id="go" href="#">Open Velaryn Code</a>
</div>
<script>
  // Sign-in from the phone apps lands here; pass the result (code or error) to the app.
  const target = 'com.velaryn.code://auth' + location.search + (location.hash ? '&' + location.hash.slice(1) : '');
  document.getElementById('go').href = target;
  location.replace(target);
</script>
</body>
</html>
